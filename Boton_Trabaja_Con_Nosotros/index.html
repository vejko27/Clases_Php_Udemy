<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabaja con Nosotros</title>
    <link rel="icon" type="image/x-icon" href="logo/SBC_TRANSPORT.ico">
   
</head>
<body class="application-page">
    <main class="form-container">
        <!-- Header -->
        <header class="page-header">
            <h1>¡Únete a Nuestro Equipo!</h1>
            <div class="header-accent"></div>
            <p>Completa el formulario para enviarnos tu candidatura</p>
        </header>

        <!-- Mensaje de respuesta -->
        <div id="mensaje" class="form-message is-hidden"></div>

        <!-- Formulario -->
        <form id="formularioCandidatura" class="application-form" enctype="multipart/form-data">
            
            <!-- Nombres Completos -->
            <div class="form-field">
                <label for="nombres">
                    Nombres Completos
                </label>
                <input 
                    type="text" 
                    id="nombres" 
                    name="nombres" 
                    placeholder="Ej: Juan Carlos"
                    required
                    class="form-control"
                />
            </div>

            <!-- Apellidos Completos -->
            <div class="form-field">
                <label for="apellidos">
                    Apellidos Completos
                </label>
                <input 
                    type="text" 
                    id="apellidos" 
                    name="apellidos" 
                    placeholder="Ej: Pérez García"
                    required
                    class="form-control"
                />
            </div>

            <!-- Correo Electrónico -->
            <div class="form-field">
                <label for="email">
                    Correo Electrónico
                </label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="correo@ejemplo.com"
                    required
                    class="form-control"
                />
            </div>

            <!-- Puesto al que postula -->
            <div class="form-field">
                <label for="disposicion">
                    Puesto al que postulas
                </label>
                <select 
                    id="disposicion" 
                    name="disposicion" 
                    required
                    class="form-control"
                >
                    <option value="">-- Selecciona una opción --</option>
                    <option value="Coordinador de flota">Coordinador de flota</option>
                    <option value="Coordinador de transporte">Coordinador de transporte</option>
                    <option value="Monitor GPS">Monitor GPS</option>
                    <option value="Asistente administrativo">Asistente administrativo</option>
                    <option value="Jefe de transporte">Jefe de transporte</option>
                    <option value="Contador">Contador</option>
                    <option value="Recursos Humanos">Recursos Humanos</option>
                </select>
            </div>

            <!-- Adjuntar CV -->
            <div class="form-field">
                <label for="cv">
                    Adjuntar CV
                </label>
                <div class="drop-zone" id="dropZone">
                    <input 
                        type="file" 
                        id="cv" 
                        name="cv" 
                        accept=".pdf,.doc,.docx"
                        required
                        class="visually-hidden"
                    />
                    <div class="drop-zone-content">
                        <svg class="upload-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                        </svg>
                        <p class="drop-zone-title">Haz clic para subir o arrastra tu archivo</p>
                        <p class="drop-zone-hint">PDF, DOC o DOCX (máx. 5MB)</p>
                    </div>
                    <span id="fileName" class="file-name is-hidden"></span>
                </div>
            </div>

            <!-- Botones -->
            <div class="form-actions">
                <button 
                    type="button"
                    id="btnEnviar"
                    class="button button-primary"
                >
                    Enviar Candidatura
                </button>
                <button 
                    type="reset"
                    class="button button-secondary"
                >
                    Limpiar
                </button>
            </div>
        </form>

        <!-- Footer -->
        <footer class="page-footer">
            <p>Gracias por tu interés en trabajar con nosotros</p>
        </footer>
    </main>

    <script>
        // Obtener elementos
        const formulario = document.getElementById('formularioCandidatura');
        const btnEnviar = document.getElementById('btnEnviar');
        const divMensaje = document.getElementById('mensaje');
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('cv');
        const fileName = document.getElementById('fileName');

        // Funcionalidad de drag and drop para el CV
        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('is-dragging');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('is-dragging');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('is-dragging');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                fileInput.files = files;
                updateFileName(files[0].name);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                updateFileName(e.target.files[0].name);
            }
        });

        function updateFileName(name) {
            fileName.textContent = '✓ Archivo seleccionado: ' + name;
            fileName.classList.remove('is-hidden');
        }

        // Mostrar/ocultar mensajes
        function mostrarMensaje(texto, esExito = false, esAdvertencia = false) {
            divMensaje.classList.remove('is-hidden', 'message-success', 'message-error', 'message-warning');
            const claseMensaje = esAdvertencia ? 'message-warning' : (esExito ? 'message-success' : 'message-error');
            const tituloMensaje = esAdvertencia ? '⚠ Candidatura guardada' : (esExito ? '✓ Éxito' : '✗ Error');
            divMensaje.classList.add(claseMensaje);
            divMensaje.innerHTML = `<p class="message-title">${tituloMensaje}</p><p>${texto}</p>`;
        }

        // Validar campos
        function validarFormulario() {
            const nombres = document.getElementById('nombres').value.trim();
            const apellidos = document.getElementById('apellidos').value.trim();
            const email = document.getElementById('email').value.trim();
            const disposicion = document.getElementById('disposicion').value.trim();
            const cv = document.getElementById('cv').files.length;

            if (!nombres) {
                mostrarMensaje('Por favor ingresa tus nombres completos');
                return false;
            }
            if (!apellidos) {
                mostrarMensaje('Por favor ingresa tus apellidos completos');
                return false;
            }
            if (!email) {
                mostrarMensaje('Por favor ingresa tu correo electrónico');
                return false;
            }
            if (!disposicion) {
                mostrarMensaje('Por favor selecciona el puesto al que postulas');
                return false;
            }
            if (cv === 0) {
                mostrarMensaje('Por favor adjunta tu CV');
                return false;
            }

            return true;
        }

        // Evento del botón Enviar
        btnEnviar.addEventListener('click', function(e) {
            e.preventDefault();

            // Validar formulario
            if (!validarFormulario()) {
                return;
            }

            // Deshabilitar botón y mostrar indicador de carga
            btnEnviar.disabled = true;
            btnEnviar.textContent = 'Enviando...';

            // Crear FormData
            const formData = new FormData(formulario);

            // Enviar datos con AJAX
            fetch('php/procesar.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.éxito) {
                    mostrarMensaje(data.mensaje, true, data.correo_enviado === false);
                    formulario.reset();
                    fileName.classList.add('is-hidden');
                    
                    // Limpiar después de 3 segundos
                    setTimeout(() => {
                        divMensaje.classList.add('is-hidden');
                    }, 3000);
                } else {
                    mostrarMensaje(data.mensaje, false);
                }
            })
            .catch(error => {
                mostrarMensaje('Error en la comunicación con el servidor: ' + error, false);
                console.error('Error:', error);
            })
            .finally(() => {
                // Rehabilitar botón
                btnEnviar.disabled = false;
                btnEnviar.textContent = 'Enviar Candidatura';
            });
        });

        // Limpiar mensaje al cambiar campos
        const campos = document.querySelectorAll('input, select');
        campos.forEach(campo => {
            campo.addEventListener('change', () => {
                if (!divMensaje.classList.contains('is-hidden')) {
                    divMensaje.classList.add('is-hidden');
                }
            });
        });
    </script>
</body>
</html>
